services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    volumes:
      - gluetun-data:/tmp/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Singapore,Hong Kong,Taiwan,Japan
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - BLOCK_MALICIOUS=on
      - VERSION_INFORMATION=off
      - HEALTH_TARGET_ADDRESSES=cloudflare.com,google.com
      - MTU=1280
    ports:
      - "8080:8080/tcp"
      - "2345:2345/tcp"
      - "39810:39810/tcp"
      - "39810:39810/udp"
    networks:
      - internal
    restart: always
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 15s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env
    volumes:
      - ./:/app
      - gluetun-data:/tmp/gluetun:ro
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 6G
  db:
    image: groonga/pgroonga:latest-alpine-16
    shm_size: 1g
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data       # <--- CHANGED THIS
      - ./stuff/TMDB_movie_dataset_v11.csv:/stuff/TMDB_movie_dataset_v11.csv
      - ./stuff/Torrents.csv:/stuff/Torrents.csv
      - ./stuff/torrent_match.csv:/stuff/torrent_match.csv

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
  gluetun-data:
  pgdata:
networks:
  internal:
    driver: bridge

version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "repository"
        out: "internal/db/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            nullable: true
            go_type:
              import: "time"
              type: "*time.Time"
# Remove or comment out the overrides that force nullable text/int to primitive types:
# - db_type: text
#   nullable: true
#   go_type: string
# - db_type: pg_catalog.int4
#   nullable: true
#   go_type: int

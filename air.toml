root = "."
tmp_dir = ".tmp"

[build]
cmd = "templ generate && bun run dev && go build -gcflags='all=-N -l' -buildvcs=false -o ./.tmp/main ./cmd/lim"
entrypoint = "./.tmp/main"

full_bin = "dlv exec ./.tmp/main --listen=0.0.0.0:2345 --headless=true --api-version=2 --accept-multiclient --continue --log --"

include_ext = ["go", "templ", "html", "json", "js", "ts", "css", "scss"]
exclude_dir = ["assets", "tmp", "dist", ".tmp","static"]
exclude_unchanged = false
follow_symlink = false
log = "build-errors-air.log"
poll = false
poll_interval = 500
delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = 500
rerun = false
rerun_delay = 500

[log]
time = false
main_only = false

[color]
main = "magenta"
watcher = "green"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

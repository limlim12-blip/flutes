root = "."
tmp_dir = ".tmp"

[build]
cmd = "go build -o ./.tmp/main ./cmd/lim"
entrypoint = "./.tmp/main"
full_bin = "./.tmp/main"

include_dir = ["cmd", "pkg", "internal", "template"]
include_ext = ["go", "tpl", "tmpl", "html", "txt"]
exclude_dir = ["assets", "tmp", "dist", ".tmp"]

[log]
time = true
